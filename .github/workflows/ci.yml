name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новий пуш у ту саму гілку скасовує попередній прогін.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Версію бере з .python-version
      - name: Install Python
        run: uv python install

      # --frozen: збірка падає, якщо uv.lock розійшовся з pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Django checks
        run: uv run python manage.py check --settings=config.settings_test

      # Ловить забуті makemigrations: модель змінили, міграцію не додали
      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings_test

      # Локальна розробка йде на SQLite, тому цей шлях теж має бути зелений.
      - name: Tests (SQLite)
        run: uv run pytest -q

  postgres:
    name: tests on postgres
    runs-on: ubuntu-latest

    # Локального Docker на машині розробки немає, тому справжня PG
    # перевіряється тут (docs/PLAN.md, Фаза 6).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://booking:booking@localhost:5432/booking

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Міграції мусять накатуватись на порожню базу з нуля
      - name: Migrate a clean database
        run: uv run python manage.py migrate --settings=config.settings_test

      - name: Tests (PostgreSQL)
        run: uv run pytest -q

  docker:
    name: image builds and boots
    runs-on: ubuntu-latest

    # Локально образ не збирається (немає Docker), тому це єдине місце, де
    # перевіряються Dockerfile, entrypoint, gunicorn і whitenoise.
    env:
      SECRET_KEY: ci-only-not-a-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_PASSWORD: ci-password
      ADMIN_PASSWORD: demo
      SERVIO_COMPANY_KEY: CI-COMPANY-KEY
      SERVIO_HOTEL_ID: '161'
      WEB_IMAGE: demo-booking:ci
      WEB_PORT: '8080'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-booking:ci .

      - name: Start the stack
        run: docker compose up -d --no-build

      # Найважливіший крок фази: доводить, що gunicorn під Python 3.14
      # реально піднімається, а міграції й ensure_admin проходять з нуля.
      - name: Wait until /healthz answers
        run: |
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null); then
              echo "healthy: $body"
              exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"
          exit 1

      - name: Smoke-check the pages
        run: |
          curl -fsS -o /dev/null -w 'search page  %{http_code}\n' http://127.0.0.1:8080/
          curl -fsS -o /dev/null -w 'admin login  %{http_code}\n' http://127.0.0.1:8080/admin/login/

      - name: Static files are served by whitenoise
        run: |
          curl -fsS -o /dev/null -w 'admin css  %{http_code}\n' \
            http://127.0.0.1:8080/static/admin/css/base.css

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
